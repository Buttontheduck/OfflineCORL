# Experiment 16: three pulls toward the dataset actions for QIPO fine-tuning (Aware/finetune_actor.py), compared on
# the same footing. Experiment 14's fine-tuned EqM field collapsed to about one action per state (the EqM sampler
# descends toward minima and training on its own samples compounds it; the dataset action held only 6-12 % of the
# weight), and its best-of-16 fell from 40 % to 20-29 % on humanoidmaze.
#   plain    QIPO as Experiment 14 (re-run with this eval protocol)
#   data16   the dataset action counts as 16 candidates in the softmax (data_mult 16; its share still depends on Q)
#   bc1      + the plain EqM-BC loss on a separate batch of dataset actions, weight 1 (bc_coef 1; independent of Q)
#   early stopping: read off every variant's curve at fixed steps 80k and 120k (checkpoints every 40k)
# Frozen Experiment 14 critics (critic_1000000.pt) and their BC actors, beta 10 (Experiment 14's best early peak on both
# envs), support at K = 20 renewed every 40k, 400k steps, Adam 1e-4, EMA 0.005 (evaluated). humanoidmaze-medium and
# antsoccer-arena default tasks, seeds 1-3 (cube-double left out: 0 % in every phase of Experiments 14 and 15).
# Eval every 40k: one sample at K = 10 and K = 20, and the critic's best of 16 at K = 20, 50 episodes. 18 runs.
# FQL default-task references (BC / IQL / FAWAC / FQL): humanoidmaze-medium task1 1 / 32 / 6 / 19, antsoccer-arena
# task4 1 / 3 / 12 / 39 (success %, Park et al. 2025, Table 3).
#   python run_sweep.py sweeps/exp16_ogbench_ft_anchor.yaml   (started by run_exp16.sh)
target: finetune_actor_ogbench
parallel: 18
gpu_gate: {util_max: 97, min_free_mb: 3000, settle_s: 60, window_s: 30}
untagged: [group]

fixed:
  name: Exp16_FT
  critic_prefix: Exp14_Critic
  critic_checkpoint: critic_1000000.pt
  min_free_mb: 4000
  support_num: 16
  support_K: 20
  renew_every: 40000
  num_train_ops: 400001     # the extra 1 makes the last eval (and checkpoint) happen at step 400,000
  learning_rate: 0.0001
  beta: 10
  eval_frequency: 40000
  eval_K: "10,20"
  eval_best_every: 40000
  n_test_episodes: 50
  eval_tasks: own
  checkpoint_every: 40000

grid:
  - {group: Exp16_FT_humanoidmaze-medium_plain, env_name: humanoidmaze-medium-navigate-singletask-v0, data_mult: 1, bc_coef: 0, seed: 1}
  - {group: Exp16_FT_antsoccer-arena_plain, env_name: antsoccer-arena-navigate-singletask-v0, data_mult: 1, bc_coef: 0, seed: 1}
  - {group: Exp16_FT_humanoidmaze-medium_data16, env_name: humanoidmaze-medium-navigate-singletask-v0, data_mult: 16, bc_coef: 0, seed: 1}
  - {group: Exp16_FT_antsoccer-arena_data16, env_name: antsoccer-arena-navigate-singletask-v0, data_mult: 16, bc_coef: 0, seed: 1}
  - {group: Exp16_FT_humanoidmaze-medium_bc1, env_name: humanoidmaze-medium-navigate-singletask-v0, data_mult: 1, bc_coef: 1, seed: 1}
  - {group: Exp16_FT_antsoccer-arena_bc1, env_name: antsoccer-arena-navigate-singletask-v0, data_mult: 1, bc_coef: 1, seed: 1}
  - {group: Exp16_FT_humanoidmaze-medium_plain, env_name: humanoidmaze-medium-navigate-singletask-v0, data_mult: 1, bc_coef: 0, seed: 2}
  - {group: Exp16_FT_antsoccer-arena_plain, env_name: antsoccer-arena-navigate-singletask-v0, data_mult: 1, bc_coef: 0, seed: 2}
  - {group: Exp16_FT_humanoidmaze-medium_data16, env_name: humanoidmaze-medium-navigate-singletask-v0, data_mult: 16, bc_coef: 0, seed: 2}
  - {group: Exp16_FT_antsoccer-arena_data16, env_name: antsoccer-arena-navigate-singletask-v0, data_mult: 16, bc_coef: 0, seed: 2}
  - {group: Exp16_FT_humanoidmaze-medium_bc1, env_name: humanoidmaze-medium-navigate-singletask-v0, data_mult: 1, bc_coef: 1, seed: 2}
  - {group: Exp16_FT_antsoccer-arena_bc1, env_name: antsoccer-arena-navigate-singletask-v0, data_mult: 1, bc_coef: 1, seed: 2}
  - {group: Exp16_FT_humanoidmaze-medium_plain, env_name: humanoidmaze-medium-navigate-singletask-v0, data_mult: 1, bc_coef: 0, seed: 3}
  - {group: Exp16_FT_antsoccer-arena_plain, env_name: antsoccer-arena-navigate-singletask-v0, data_mult: 1, bc_coef: 0, seed: 3}
  - {group: Exp16_FT_humanoidmaze-medium_data16, env_name: humanoidmaze-medium-navigate-singletask-v0, data_mult: 16, bc_coef: 0, seed: 3}
  - {group: Exp16_FT_antsoccer-arena_data16, env_name: antsoccer-arena-navigate-singletask-v0, data_mult: 16, bc_coef: 0, seed: 3}
  - {group: Exp16_FT_humanoidmaze-medium_bc1, env_name: humanoidmaze-medium-navigate-singletask-v0, data_mult: 1, bc_coef: 1, seed: 3}
  - {group: Exp16_FT_antsoccer-arena_bc1, env_name: antsoccer-arena-navigate-singletask-v0, data_mult: 1, bc_coef: 1, seed: 3}
