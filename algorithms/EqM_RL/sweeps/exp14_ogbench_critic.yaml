# Experiment 14 (QIPO pipeline on OGBench, as Experiments 10 -> 11 -> 12b on D4RL AntMaze), default tasks of
# humanoidmaze-medium (task1), antsoccer-arena (task4) and cube-double (task2), EqM actor only, seeds 1-3.
# Phase 2: in-support softmax critics for the frozen BC actors (Aware/train_critic.py), as Experiment 11: target
# r + gamma (1 - d) sum_j softmax_j(3 Q'(s', a'_j)) Q'(s', a'_j) over the dataset next action and 16 BC samples at K = 10.
# Changes for OGBench: FQL's critic size (4 x 512) with LayerNorm, the target clipped to [r_min / (1 - gamma), 0] (both
# against the divergence of Experiment 11's umaze-diverse critics), FQL's discounts (0.995 humanoidmaze and antsoccer,
# 0.99 cube-double). 1M steps; eval every 100k: the critic's best of 16 BC samples, 50 episodes. Each critic waits for
# its BC checkpoint (checkpoint_500000.pt) and for 4 GB of free GPU memory. 9 runs.
# FQL default-task references (BC / IQL / FAWAC / FQL): humanoidmaze-medium task1 1 / 32 / 6 / 19, antsoccer-arena
# task4 1 / 3 / 12 / 39, cube-double task2 0 / 1 / 2 / 36 (success %, Park et al. 2025, Table 3).
#   python run_sweep.py sweeps/exp14_ogbench_critic.yaml   (started by run_exp14.sh, alongside phase 1)
target: train_critic_ogbench
parallel: 9
gpu_gate: {util_max: 97, min_free_mb: 3000, settle_s: 30, window_s: 30}
untagged: [group, gamma]

fixed:
  name: Exp14_Critic
  bc_prefix: Exp14_BC
  bc_checkpoint: checkpoint_500000.pt
  min_free_mb: 4000
  support_num: 16
  support_K: 10
  beta: 3.0
  hidden_dim: 512
  n_hidden: 4
  layer_norm: true
  target_clip: true
  num_train_ops: 1000001    # the extra 1 makes the last eval (and checkpoint) happen at step 1,000,000
  eval_frequency: 100000
  n_test_episodes: 50
  eval_candidates: 16
  eval_tasks: own
  checkpoint_every: 100000

grid:
  - {group: Exp14_Critic_humanoidmaze-medium, env_name: humanoidmaze-medium-navigate-singletask-v0, bc_actor: eqm, gamma: 0.995, seed: 1}
  - {group: Exp14_Critic_antsoccer-arena, env_name: antsoccer-arena-navigate-singletask-v0, bc_actor: eqm, gamma: 0.995, seed: 1}
  - {group: Exp14_Critic_cube-double, env_name: cube-double-play-singletask-v0, bc_actor: eqm, gamma: 0.99, seed: 1}
  - {group: Exp14_Critic_humanoidmaze-medium, env_name: humanoidmaze-medium-navigate-singletask-v0, bc_actor: eqm, gamma: 0.995, seed: 2}
  - {group: Exp14_Critic_antsoccer-arena, env_name: antsoccer-arena-navigate-singletask-v0, bc_actor: eqm, gamma: 0.995, seed: 2}
  - {group: Exp14_Critic_cube-double, env_name: cube-double-play-singletask-v0, bc_actor: eqm, gamma: 0.99, seed: 2}
  - {group: Exp14_Critic_humanoidmaze-medium, env_name: humanoidmaze-medium-navigate-singletask-v0, bc_actor: eqm, gamma: 0.995, seed: 3}
  - {group: Exp14_Critic_antsoccer-arena, env_name: antsoccer-arena-navigate-singletask-v0, bc_actor: eqm, gamma: 0.995, seed: 3}
  - {group: Exp14_Critic_cube-double, env_name: cube-double-play-singletask-v0, bc_actor: eqm, gamma: 0.99, seed: 3}
