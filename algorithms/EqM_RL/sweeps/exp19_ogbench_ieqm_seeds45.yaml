# Experiment 19, two more seeds of the baseline (expectile 0.9): seeds 4 and 5, so that the baseline has 5 seeds like
# the two settings of Experiment 20. Same settings and run names as sweeps/exp19_ogbench_ieqm.yaml, except that
# these runs score no frozen actor (Experiment 14 trained EqM-BC actors for seeds 1-3 only).
#   python run_sweep.py sweeps/exp19_ogbench_ieqm_seeds45.yaml   (started by run_exp20.sh, after Experiment 20's sweep)
target: train_ieqm_ogbench
parallel: 2
gpu_gate: {util_max: 97, min_free_mb: 3000, settle_s: 30, window_s: 30}
untagged: [group]

fixed:
  name: Exp19_IEQM
  compile: true
  gamma: 0.995
  num_train_ops: 1000001
  eval_frequency: 100000
  n_test_episodes: 50
  eval_candidates: 32
  eval_tasks: own
  checkpoint_every: 100000

grid:
  - {group: Exp19_IEQM_humanoidmaze-medium, env_name: humanoidmaze-medium-navigate-singletask-v0, seed: [4, 5]}
