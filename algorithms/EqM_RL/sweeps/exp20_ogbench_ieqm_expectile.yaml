# Experiment 20: IEQM (Aware/train_ieqm.py, Experiment 19) with a lower expectile, on humanoidmaze-medium task 1.
# Why: in Experiment 19 (expectile 0.9) the critic of seed 1 (from 800k) and of seed 3 (at 1M) grew a false peak of V
# at maze cell (4,2), and the policy walked there instead of to the goal (IFQL.md, Section 12.7). The expectile lifts V
# above the average Q of the dataset actions: for a bell-shaped spread of size s, by 0.86 s at 0.9, 0.55 s at 0.8 and
# 0.34 s at 0.7. A smaller lift may stop the peak; the cost may be a critic that ranks the candidates less sharply.
# Only the expectile changes. Everything else is Experiment 19: 1M steps, eval every 100k with 50 episodes, best of 32.
# Order of the runs (5 at once): expectile 0.7 seeds 1-5, then expectile 0.8 seeds 1-5. The baseline's seeds 4 and 5
# (expectile 0.9) are sweeps/exp19_ogbench_ieqm_seeds45.yaml, run after this file by run_exp20.sh.
# Seeds 1-3 also score Experiment 14's frozen EqM-BC actor of the same seed; seeds 4 and 5 have no such actor.
#   python run_sweep.py sweeps/exp20_ogbench_ieqm_expectile.yaml   (started by run_exp20.sh)
target: train_ieqm_ogbench
parallel: 5
gpu_gate: {util_max: 97, min_free_mb: 3000, settle_s: 30, window_s: 30}
untagged: [group, frozen_bc_prefix]

fixed:
  name: Exp20_IEQM
  compile: true
  bc_checkpoint: checkpoint_500000.pt
  gamma: 0.995
  num_train_ops: 1000001    # the extra 1 makes the last eval (and checkpoint) happen at step 1,000,000
  eval_frequency: 100000
  n_test_episodes: 50
  eval_candidates: 32
  eval_tasks: own
  checkpoint_every: 100000

grid:
  - {group: Exp20_IEQM_expectile0.7, env_name: humanoidmaze-medium-navigate-singletask-v0, expectile: 0.7, frozen_bc_prefix: Exp14_BC, seed: [1, 2, 3]}
  - {group: Exp20_IEQM_expectile0.7, env_name: humanoidmaze-medium-navigate-singletask-v0, expectile: 0.7, seed: [4, 5]}
  - {group: Exp20_IEQM_expectile0.8, env_name: humanoidmaze-medium-navigate-singletask-v0, expectile: 0.8, frozen_bc_prefix: Exp14_BC, seed: [1, 2, 3]}
  - {group: Exp20_IEQM_expectile0.8, env_name: humanoidmaze-medium-navigate-singletask-v0, expectile: 0.8, seed: [4, 5]}
