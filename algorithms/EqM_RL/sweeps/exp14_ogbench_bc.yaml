# Experiment 14 (QIPO pipeline on OGBench, as Experiments 10 -> 11 -> 12b on D4RL AntMaze), default tasks of
# humanoidmaze-medium (task1), antsoccer-arena (task4) and cube-double (task2), EqM actor only, seeds 1-3.
# Phase 1: EqM behavior cloning (Aware/fit_actor.py --actor=eqm --weights=ones), 500k steps, as Experiment 10:
# 4 x 256 field, K = 20 (trained), evals at K = 20 (main), 10 and 30, every 50k with 50 episodes of the default task.
# checkpoint_500000.pt is what phase 2 loads. 9 runs.
# FQL default-task references (BC / IQL / FAWAC / FQL): humanoidmaze-medium task1 1 / 32 / 6 / 19, antsoccer-arena
# task4 1 / 3 / 12 / 39, cube-double task2 0 / 1 / 2 / 36 (success %, Park et al. 2025, Table 3).
#   python run_sweep.py sweeps/exp14_ogbench_bc.yaml   (started by run_exp14.sh)
target: fit_actor_ogbench
parallel: 9
gpu_gate: {util_max: 97, min_free_mb: 3000, settle_s: 30, window_s: 30}
untagged: [group]

fixed:
  name: Exp14_BC
  weights: ones
  data_filter: all
  num_train_ops: 500001     # the extra 1 makes the last eval (and checkpoint) happen at step 500,000
  eval_frequency: 50000
  n_test_episodes: 50       # per task (OGBench's protocol)
  eval_tasks: own
  eval_num_steps: "10,30"
  checkpoint_every: 100000

grid:
  - {group: Exp14_BC_humanoidmaze-medium, env_name: humanoidmaze-medium-navigate-singletask-v0, actor: eqm, seed: 1}
  - {group: Exp14_BC_antsoccer-arena, env_name: antsoccer-arena-navigate-singletask-v0, actor: eqm, seed: 1}
  - {group: Exp14_BC_cube-double, env_name: cube-double-play-singletask-v0, actor: eqm, seed: 1}
  - {group: Exp14_BC_humanoidmaze-medium, env_name: humanoidmaze-medium-navigate-singletask-v0, actor: eqm, seed: 2}
  - {group: Exp14_BC_antsoccer-arena, env_name: antsoccer-arena-navigate-singletask-v0, actor: eqm, seed: 2}
  - {group: Exp14_BC_cube-double, env_name: cube-double-play-singletask-v0, actor: eqm, seed: 2}
  - {group: Exp14_BC_humanoidmaze-medium, env_name: humanoidmaze-medium-navigate-singletask-v0, actor: eqm, seed: 3}
  - {group: Exp14_BC_antsoccer-arena, env_name: antsoccer-arena-navigate-singletask-v0, actor: eqm, seed: 3}
  - {group: Exp14_BC_cube-double, env_name: cube-double-play-singletask-v0, actor: eqm, seed: 3}
