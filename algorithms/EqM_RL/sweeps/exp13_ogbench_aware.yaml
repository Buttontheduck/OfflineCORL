# Experiment 13: Aware on OGBench single-task, default tasks (humanoidmaze-medium task1, antsoccer-arena task4,
# cube-double task2), AWAC critic vs IQL critic, seeds 1-3: 18 runs (branch jit: OGBench support + compile=true).
# Protocol as FQL (Park et al. 2025) for state-based OGBench: 1M gradient steps, eval every 100k with 50 episodes
# of the trained task; the score is the success rate in %, the mean of the evals at 800k, 900k and 1M.
# Hyperparameters from FQL's tables: discount 0.995 (humanoidmaze, antsoccer) / 0.99 (cube-double); temperature
# T = 1/alpha with alpha FQL tuned for FAWAC (flow + AWR, the closest baseline): 3 / 10 / 0.3; IQL expectile 0.9.
# Both critics use the same T, so only the critic differs. Aware's own networks (4 x 256 Mish, no layer norm).
# FQL default-task references (IQL / FAWAC / FQL): humanoidmaze-medium 32 / 6 / 19, antsoccer 3 / 12 / 39,
# cube-double 1 / 2 / 36.
# The GPU can't hold all 18 at once (humanoidmaze's 2M-transition buffer ~1.3 GB per run): gpu_gate starts a
# further run only while >= 3 GB are free. Started by run_exp13.sh (the summary follows).
#   python run_sweep.py sweeps/exp13_ogbench_aware.yaml
target: aware_ogbench
parallel: 18
gpu_gate: {util_max: 97, min_free_mb: 3000, settle_s: 90, window_s: 30}
untagged: [group, gamma, temperature]

fixed:
  name: Exp13_Aware
  compile: true
  num_train_ops: 1000001    # the extra 1 makes the last eval (and checkpoint) happen at step 1,000,000
  eval_frequency: 100000
  n_test_episodes: 50
  eval_tasks: own
  agent.iql_tau: 0.9        # used by the iql critic only

grid:
  - {group: Exp13_awac_humanoidmaze-medium, env_name: humanoidmaze-medium-navigate-singletask-v0, gamma: 0.995, temperature: 0.3333333333, agent.critic: awac, seed: 1}
  - {group: Exp13_awac_antsoccer-arena, env_name: antsoccer-arena-navigate-singletask-v0, gamma: 0.995, temperature: 0.1, agent.critic: awac, seed: 1}
  - {group: Exp13_awac_cube-double, env_name: cube-double-play-singletask-v0, gamma: 0.99, temperature: 3.3333333333, agent.critic: awac, seed: 1}
  - {group: Exp13_iql_humanoidmaze-medium, env_name: humanoidmaze-medium-navigate-singletask-v0, gamma: 0.995, temperature: 0.3333333333, agent.critic: iql, seed: 1}
  - {group: Exp13_iql_antsoccer-arena, env_name: antsoccer-arena-navigate-singletask-v0, gamma: 0.995, temperature: 0.1, agent.critic: iql, seed: 1}
  - {group: Exp13_iql_cube-double, env_name: cube-double-play-singletask-v0, gamma: 0.99, temperature: 3.3333333333, agent.critic: iql, seed: 1}
  - {group: Exp13_awac_humanoidmaze-medium, env_name: humanoidmaze-medium-navigate-singletask-v0, gamma: 0.995, temperature: 0.3333333333, agent.critic: awac, seed: 2}
  - {group: Exp13_awac_antsoccer-arena, env_name: antsoccer-arena-navigate-singletask-v0, gamma: 0.995, temperature: 0.1, agent.critic: awac, seed: 2}
  - {group: Exp13_awac_cube-double, env_name: cube-double-play-singletask-v0, gamma: 0.99, temperature: 3.3333333333, agent.critic: awac, seed: 2}
  - {group: Exp13_iql_humanoidmaze-medium, env_name: humanoidmaze-medium-navigate-singletask-v0, gamma: 0.995, temperature: 0.3333333333, agent.critic: iql, seed: 2}
  - {group: Exp13_iql_antsoccer-arena, env_name: antsoccer-arena-navigate-singletask-v0, gamma: 0.995, temperature: 0.1, agent.critic: iql, seed: 2}
  - {group: Exp13_iql_cube-double, env_name: cube-double-play-singletask-v0, gamma: 0.99, temperature: 3.3333333333, agent.critic: iql, seed: 2}
  - {group: Exp13_awac_humanoidmaze-medium, env_name: humanoidmaze-medium-navigate-singletask-v0, gamma: 0.995, temperature: 0.3333333333, agent.critic: awac, seed: 3}
  - {group: Exp13_awac_antsoccer-arena, env_name: antsoccer-arena-navigate-singletask-v0, gamma: 0.995, temperature: 0.1, agent.critic: awac, seed: 3}
  - {group: Exp13_awac_cube-double, env_name: cube-double-play-singletask-v0, gamma: 0.99, temperature: 3.3333333333, agent.critic: awac, seed: 3}
  - {group: Exp13_iql_humanoidmaze-medium, env_name: humanoidmaze-medium-navigate-singletask-v0, gamma: 0.995, temperature: 0.3333333333, agent.critic: iql, seed: 3}
  - {group: Exp13_iql_antsoccer-arena, env_name: antsoccer-arena-navigate-singletask-v0, gamma: 0.995, temperature: 0.1, agent.critic: iql, seed: 3}
  - {group: Exp13_iql_cube-double, env_name: cube-double-play-singletask-v0, gamma: 0.99, temperature: 3.3333333333, agent.critic: iql, seed: 3}
