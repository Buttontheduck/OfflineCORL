# Aware on Minari HalfCheetah: gradient multiplier lambda (agent.scale_gradient), 3 seeds.
# simple-v0: lambda 2, 4, 8 (9 runs); medium-v0: lambda 4, 8 (6 runs). 15 runs, eagle env.
#   python run_sweep.py sweeps/scale_minari_simple_medium.yaml
target: aware_minari
parallel: 16

fixed:
  num_train_ops: 120001

grid:
  - env_name: mujoco/halfcheetah/simple-v0
    agent.scale_gradient: [2.0, 4.0, 8.0]
    seed: [1, 2, 3]
  - env_name: mujoco/halfcheetah/medium-v0
    agent.scale_gradient: [4.0, 8.0]
    seed: [1, 2, 3]
