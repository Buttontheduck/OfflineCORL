# Experiment 22: IEQM on OGBench antsoccer-arena, default task (task 4).
# Discount 0.999 / 0.995 x expectile 0.9 / 0.8 x seeds 1-3 = 12 runs.
# Same algorithm and evaluation as Experiment 21; no frozen actor comparison.
target: train_ieqm_ogbench
parallel: 12
gpu_gate: {util_max: 97, min_free_mb: 3000, settle_s: 30, window_s: 30}
untagged: [group]

fixed:
  name: Exp22_IEQM
  project: E
  env_name: antsoccer-arena-navigate-singletask-v0
  compile: true
  num_train_ops: 1000001
  eval_frequency: 100000
  n_test_episodes: 50
  eval_candidates: 32
  eval_tasks: own
  num_step: 20
  checkpoint_every: 100000
  checkpoints_path: /workspace/OfflineCORL/algorithms/EqM_RL/sweep_runs/exp22_checkpoints

grid:
  - {group: Exp22_IEQM_antsoccer_gamma0.999_expectile0.9, gamma: 0.999, expectile: 0.9, seed: [1, 2, 3]}
  - {group: Exp22_IEQM_antsoccer_gamma0.999_expectile0.8, gamma: 0.999, expectile: 0.8, seed: [1, 2, 3]}
  - {group: Exp22_IEQM_antsoccer_gamma0.995_expectile0.9, gamma: 0.995, expectile: 0.9, seed: [1, 2, 3]}
  - {group: Exp22_IEQM_antsoccer_gamma0.995_expectile0.8, gamma: 0.995, expectile: 0.8, seed: [1, 2, 3]}
