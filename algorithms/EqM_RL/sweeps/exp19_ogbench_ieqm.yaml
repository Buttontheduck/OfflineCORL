# Experiment 19: IEQM = the IFQL recipe (IFQL.md) with our EqM actor, on humanoidmaze-medium task 1, seeds 1-3.
# Aware/train_ieqm.py trains three things on the same batches, 1M steps, as IFQL does:
#   V, Q1, Q2    IFQL's critic, unchanged: expectile 0.9, 4 x 512 with GELU and LayerNorm, gamma 0.995, target rate
#                0.005, Adam 3e-4, batch 256, raw states, dataset actions clipped to +-(1 - 1e-5), no target clipping
#   EqM field    behaviour cloning with Aware's EqM loss (every weight 1), 4 x 512 (IFQL's actor size), K = 20 NAG
#                sampler steps; it never sees Q or V, and the critic never sees its samples
# Eval every 100k, 50 episodes of task 1: best of 32 actor samples, chosen by the trained critic's min(Q1, Q2).
# Two actors are evaluated with the same critic:
#   trained   the EqM field trained in this run             -> IEQM's score; differs from IFQL (69 %) in the actor type
#   frozen    Experiment 14's EqM-BC of the same seed       -> differs from Experiment 15 (best of 32 at K = 20: 39 %)
#             (4 x 256, 500k steps, checkpoint_500000.pt)      only in the critic (IQL here, QIPO there)
# Score = success in %, the mean of the evals at 800k, 900k and 1M (FQL's protocol).
# FQL default-task references (BC / IQL / FAWAC / FQL / IFQL): 1 / 32 / 6 / 19 / 69 (Park et al. 2025, Table 3).
#   python run_sweep.py sweeps/exp19_ogbench_ieqm.yaml   (started by run_exp19.sh; the summary follows)
target: train_ieqm_ogbench
parallel: 3
gpu_gate: {util_max: 97, min_free_mb: 3000, settle_s: 30, window_s: 30}
untagged: [group]

fixed:
  name: Exp19_IEQM
  compile: true             # same maths, about 3x faster per step (checked: the critic's losses agree to 4 digits after 3,000 steps)
  frozen_bc_prefix: Exp14_BC
  bc_checkpoint: checkpoint_500000.pt
  gamma: 0.995
  num_train_ops: 1000001    # the extra 1 makes the last eval (and checkpoint) happen at step 1,000,000
  eval_frequency: 100000
  n_test_episodes: 50
  eval_candidates: 32
  eval_tasks: own
  checkpoint_every: 100000

grid:
  - {group: Exp19_IEQM_humanoidmaze-medium, env_name: humanoidmaze-medium-navigate-singletask-v0, seed: [1, 2, 3]}
