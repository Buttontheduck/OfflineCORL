# wandb configuration
project: E
group: test_halfcheetah_medium_v2
name: run_2
run_id: null

# environment and dataset
env_name: halfcheetah-medium-v2    #hopper-medium-v2 #walker2d-medium-v2 #halfcheetah-medium-expert-v2

seed: 42
test_seed: 69
deterministic_torch: false

num_train_ops: 120001   # 120k updates; the extra 1 makes the last eval happen at step 120000

# Network Architecture Hyperparameters
hidden_dim: 256
num_hidden_layers: 4
buffer_size: 2_000_000
batch_size: 256

# Optimization Hyperparameters
learning_rate: 3e-4
gamma: 0.99
tau: 5e-3
temperature: 1.0

# training flags and evaluation
normalize_reward: false
eval_frequency: 1000
log_frequency: 1000       # train/* and weighting/* go to wandb every this many steps, averaged over them
n_test_episodes: 10       # eval episodes, run side by side (batched sampler), so 10 cost about as much as 1
num_actions_inference: 1
diag_states: 256          # dataset states for the sampler/* logs at each eval (0 = off)
diag_samples: 8           # samples per state for those logs

# saving and reproducibility
checkpoints_path: "/workspace/Trained_Models/checkpoints/"   # null = no checkpoints
device: cuda # or 'mps' (Mac) / 'cpu'
compile: false                  # true = torch.compile the EqM sampler's K-step loop (Actor.compile_sampler)
compile_mode: reduce-overhead   # 'reduce-overhead' = also replay it as one CUDA graph; 'default' = fusion only

# Otter Agent Hyperparameters (Unpacked via **cfg.agent)
agent:
  gamma: ${gamma}
  tau: ${tau}
  temperature: ${temperature}
  exp_adv_max: 100.0
  fino: false
  flag_type: 'trun'
  flag_threshold: 0.8
  scale_gradient: 8.0
  num_actions: 1
  fino_knob: 0.1
  weighting: 'awac'   # 'awac' = exp(A/T) weights; 'bc' = all weights 1 (behavior cloning ablation)
  critic: 'awac'      # 'awac' = Q on the actor's next action, V(s) from the actor's sample (Aware); 'iql' = IQL's in-sample critic (V by expectile regression, Q target r + gamma V(s'))
  iql_tau: 0.7        # IQL expectile for V(s); only used with critic: 'iql' (CORL: 0.7 locomotion, 0.9 AntMaze)


actor: 
  ebm: null
  opt_type: 'nag' # gd or nag
  step_size: 0.01
  num_step: 20
  moment: 0.3
  sampler_type: 'implicit' #implicit #implicit_OOD #implicit_stop #implicit_stop_OOD
  ood_threshold: 0.01
  early_stop: null
